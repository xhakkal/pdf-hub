<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <!-- Gradiente laranja -->
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
    <!-- Gradiente do texto branco -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>

  <!-- PDF em branco -->
  <text x="80" y="72"
        font-family="'Arial', 'Helvetica', sans-serif"
        font-size="58" font-weight="900"
        text-anchor="middle"
        fill="url(#textGrad)">PDF</text>

  <!-- "hub" em laranja com fundo -->
  <rect x="124" y="30" width="72" height="50" rx="8" fill="url(#orangeGrad)"/>
  <text x="160" y="66"
        font-family="'Arial', 'Helvetica', sans-serif"
        font-size="44" font-weight="900"
        text-anchor="middle"
        fill="#111">hub</text>
</svg>